<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面改版前后对照</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#25354d;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{display:flex;gap:24px;align-items:center;background:white;border-bottom:1px solid #dce5f1;padding:20px 28px}h1{font-size:20px;margin:0}select{font:inherit;padding:8px 12px;border:1px solid #bfcee2;border-radius:6px}main{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}h2{font-size:14px;margin:0;padding:12px 16px;background:white;border-bottom:1px solid #dce5f1}figure{margin:0;border:1px solid #dce5f1;border-radius:10px;overflow:hidden;background:white}img{display:block;width:100%;height:auto}p{margin:0 28px 24px;color:#64768d;font-size:12px}select:focus-visible{outline:3px solid #3269b8;outline-offset:3px}@media(max-width:800px){main{grid-template-columns:1fr}header{flex-wrap:wrap}}</style><header><h1>桌面工作台 · 改版前后对照</h1><label for="page">页面</label><select id="page"><option value="dashboard">工作台首页</option><option value="login">登录</option><option value="list">问卷列表</option><option value="editor">编辑器</option><option value="fill">正式填写</option><option value="statistics">分版本统计</option></select></header><main><figure><h2>改版前</h2><img id="before" alt="工作台首页改版前" src="screenshots/desktop-polish-1792248106444/before/dashboard.png"></figure><figure><h2>改版后</h2><img id="after" alt="工作台首页改版后" src="screenshots/desktop-polish-1792248106444/after/dashboard.png"></figure></main><p>同一独立测试库与同一批实际测试答卷，1440×1000真实浏览器截图。数据不属于业务库；页面不提供业务操作。</p><script>document.querySelector('select').addEventListener('change',event=>{for(const phase of ['before','after']){const el=document.getElementById(phase);el.src='screenshots/desktop-polish-1792248106444/'+phase+'/'+event.target.value+'.png';el.alt=event.target.selectedOptions[0].text+(phase==='before'?'改版前':'改版后');}});</script></html>
